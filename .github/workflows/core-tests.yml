name: Core tests

on:
  pull_request:
    paths:
      - 'src/ExHyperV.Core/**'
      - 'src/ExHyperV.Core.Tests/**'
      - 'src/ExHyperV.sln'
      - 'src/ExHyperV.Core.Tests/Scripts/Test-Core.ps1'
      - '.github/workflows/core-tests.yml'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/NuGet.Config'
      - '**/nuget.config'
  push:
    paths:
      - 'src/ExHyperV.Core/**'
      - 'src/ExHyperV.Core.Tests/**'
      - 'src/ExHyperV.sln'
      - 'src/ExHyperV.Core.Tests/Scripts/Test-Core.ps1'
      - '.github/workflows/core-tests.yml'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/NuGet.Config'
      - '**/nuget.config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025-vs2026
          - runtime: win-arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Run regression and offline Windows integration tests
        shell: pwsh
        run: ./src/ExHyperV.Core.Tests/Scripts/Test-Core.ps1 -Runtime ${{ matrix.runtime }} -Suite All -LockedRestore
      - name: Summarize results
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem .artifacts/1x/core-tests/results -Filter summary.json -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $s = Get-Content $_.FullName -Raw | ConvertFrom-Json
            "Core $($s.runtime): $($s.status); $($s.passed)/$($s.total) passed; $($s.failed) failed; $($s.notExecuted) unexecuted." >> $env:GITHUB_STEP_SUMMARY
            foreach ($problem in $s.problems) { "- $problem" >> $env:GITHUB_STEP_SUMMARY }
            if ($null -ne $s.lineCoverage) {
              "Managed Core coverage: lines $([math]::Round(100 * $s.lineCoverage, 2))%; branches $([math]::Round(100 * $s.branchCoverage, 2))%." >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - name: Upload test reports and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-tests-${{ matrix.runtime }}
          path: .artifacts/1x/core-tests/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
