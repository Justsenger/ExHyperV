name: Server 接入检查

on:
  push:
    paths: ['src/ExHyperV.Core/**', 'src/ExHyperV.Server/**', 'src/ExHyperV.Server.Tests/**', '.github/workflows/server-tests.yml', 'global.json']
  pull_request:
    paths: ['src/ExHyperV.Core/**', 'src/ExHyperV.Server/**', 'src/ExHyperV.Server.Tests/**', '.github/workflows/server-tests.yml', 'global.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Server（${{ matrix.runtime }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025-vs2026
          - runtime: win-arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '11.0.x'
      - name: 编译最新 Core 并检查 Server
        shell: pwsh
        run: ./src/ExHyperV.Server.Tests/Test-Server.ps1 -Runtime ${{ matrix.runtime }}
      - name: 发布检查产物与契约校验
        shell: pwsh
        run: |
          ./src/ExHyperV.Server/Build.ps1 -Runtime ${{ matrix.runtime }}
          & "./.cache/server/${{ matrix.runtime }}/ExHyperV.Server.exe" --verify-contracts
          if ($LASTEXITCODE -ne 0) { throw "Server contract verification failed: $LASTEXITCODE" }
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-tests-${{ matrix.runtime }}
          path: |
            .cache/server/tests/${{ matrix.runtime }}/results/
            .cache/server/tests/${{ matrix.runtime }}/build.log
          include-hidden-files: true
          retention-days: 14
