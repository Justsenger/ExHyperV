name: MCP 接入检查

on:
  push:
    paths: ['src/ExHyperV.Core/**', 'src/ExHyperV.Mcp/**', 'src/ExHyperV.Mcp.Tests/**', '.github/workflows/mcp-tests.yml']
  pull_request:
    paths: ['src/ExHyperV.Core/**', 'src/ExHyperV.Mcp/**', 'src/ExHyperV.Mcp.Tests/**', '.github/workflows/mcp-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MCP（${{ matrix.runtime }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025-vs2026
          - runtime: win-arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: 编译最新 Core 并检查 MCP
        shell: pwsh
        run: ./src/ExHyperV.Mcp.Tests/Test-Mcp.ps1 -Runtime ${{ matrix.runtime }}
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-tests-${{ matrix.runtime }}
          path: |
            .artifacts/mcp/tests/${{ matrix.runtime }}/results/
            .artifacts/mcp/tests/${{ matrix.runtime }}/build.log
          include-hidden-files: true
          retention-days: 14
