<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ExHyperV Core 测试</title>
  <script nonce="__NONCE__">try{if(localStorage.getItem('exhyperv-tests-theme')==='light')document.documentElement.dataset.bsTheme='light';}catch{}</script>
  <style nonce="__NONCE__">__TABLER_CSS__</style>
  <style nonce="__NONCE__">
    :root{--ink:#e6edf7;--muted:#9baec6;--line:#2c3d54;--accent:#74b3ff;--canvas:#101a28;--surface:#182536;--surface-alt:#1d2e43;--hover:#21354d;--good:#6cdbac;--bad:#ff9199;--warn:#f3c570;--blue:#74b3ff;--header-height:121px;color-scheme:dark}

    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
    [hidden]{display:none!important}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1:focus{outline:0}

    .workflow{list-style:none;max-width:1376px;margin:0 auto;padding:0 0 12px;display:flex;gap:12px}.workflow li{margin:0;display:flex;align-items:center;gap:10px;flex:1;color:var(--muted);padding:0 16px;min-height:46px;border-radius:6px}.workflow li+li{border-left:1px solid var(--line)}.step-number{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0}.workflow strong{display:block;font-size:13px;font-weight:600}.workflow small{display:block;font-size:11px}.workflow .active{color:var(--ink);background:var(--surface-alt)}.workflow .active .step-number{background:#206bc4;border-color:#206bc4;color:#fff}.workflow .visited .step-number{border-color:var(--accent);color:var(--accent)}.deployment .workflow{display:none}.deployment{--header-height:63px}
    main{max-width:1440px;margin:0 auto;padding:0 32px 48px}header{position:sticky;top:var(--header-height);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--canvas);padding:22px 0 18px;flex-wrap:wrap}h1{font-size:23px;line-height:1.35;margin:0;font-weight:650;letter-spacing:-.025em}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn,button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 13px;line-height:1.45;font-weight:500;box-shadow:none}.btn:hover,button:hover:enabled{background:var(--hover);color:var(--ink);border-color:var(--line)}button.primary{background:#206bc4;border-color:#206bc4;color:#fff;padding-inline:22px}button.primary:hover:enabled{background:#287bdc;border-color:#287bdc;color:#fff}.btn-quiet{background:transparent;font-size:12px;padding:6px 10px}#stop-test{color:var(--bad)}
    h2{font-size:15px;font-weight:600;margin:0}h3{font-size:14px;font-weight:600;margin:0;line-height:1.55}p{margin:0;color:var(--muted)}.card,.overview{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 5px #00000008}.card-header{padding:16px 20px;min-height:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-heading{display:flex;align-items:center;gap:10px}.card-icon{color:var(--accent);width:20px;height:20px;flex-shrink:0}.card-body{padding:18px 20px}.overview{padding:20px;margin-bottom:20px}.progress-label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}.progress-label>span:last-child{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}progress{appearance:none;display:block;width:100%;height:6px;border:0;border-radius:5px;overflow:hidden;margin:15px 0 20px;background:var(--line);accent-color:#4299ff}progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:#4299ff;border-radius:5px}progress::-moz-progress-bar{background:#4299ff}.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border:1px solid var(--line);border-radius:7px;background:var(--surface-alt);padding:13px 15px;color:var(--muted);font-size:12px;min-width:0}.metric b{display:block;font-size:25px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:4px}.metric[data-status=ready] b,.metric[data-status=passed] b{color:var(--good)}.metric[data-status=failed] b,.metric[data-status=missing] b,.metric[data-status=unavailable] b{color:var(--bad)}.metric[data-status=running] b{color:var(--blue)}.metric[data-status=pending] b,.metric[data-status=skipped] b{color:var(--warn)}.context{font-size:12px;color:var(--muted);margin-top:14px}.page-notice,#notice{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--bad);margin-top:12px}.page-notice:empty,#notice:empty{display:none}#update-notice{padding:10px 16px;background:var(--surface-alt);border-radius:6px}.resource-save-state{font-size:12px;padding:12px 20px;border-top:1px solid var(--line);white-space:pre-wrap}.resource-save-state.error{color:var(--bad)}.resource-save-state.saved{color:var(--muted)}
    .setup-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start;margin-bottom:24px}.setup-layout>.overview{margin-bottom:0}.resource-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.resource-field{display:flex;flex-direction:column;gap:8px;min-width:0;font-weight:600;font-size:13px}.resource-field.wide{grid-column:1/-1}.field-title{display:flex;gap:8px;align-items:center}.resource-field select,.plan-tools input,.plan-tools select,.result-tools input,.result-tools select{font-weight:400;padding:9px 12px;min-width:0;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--canvas);color:var(--ink)}.resource-field select{padding-right:24px}.resource-field small,.resource-help{font-size:12px;line-height:1.6;font-weight:400;color:var(--muted);overflow-wrap:anywhere}.cache-panel{border:1px dashed var(--line);border-radius:7px;padding:12px 14px;background:var(--surface-alt)}.cache-path{font:12px/1.7 Consolas,monospace;overflow-wrap:anywhere}.device-choices{display:grid;gap:8px}.device-choices .choice{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;align-items:start;background:var(--surface-alt);font-weight:400}.device-choices .choice:has(input:checked){border-color:var(--accent)}.device-choices span{min-width:0;overflow-wrap:anywhere}.device-choices small{display:block;font:11px/1.7 Consolas,monospace;margin-top:3px}.choice{display:flex;gap:11px;align-items:center;cursor:pointer;width:fit-content}.choice input,input[type=checkbox]{accent-color:#4299ff;width:17px;height:17px;margin:0;flex-shrink:0}.device-choices input{margin-top:3px}.choice:has(input:disabled){cursor:default}
    #groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}#groups>section{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}#groups h2{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.resource-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;padding:13px 18px;border-bottom:1px solid var(--line);align-items:start}.resource-row:last-child{border-bottom:0}.name{font-size:13px;font-weight:600}.detail{grid-column:1/-1;font-size:12px;line-height:1.65;color:var(--muted);overflow-wrap:anywhere}.status{position:static;display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.5;font-weight:600;padding:3px 8px;border:1px solid transparent;border-radius:5px;white-space:nowrap}.status::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor}.ready,.passed{color:var(--good);background:color-mix(in srgb,var(--good) 11%,transparent)}.missing,.unavailable,.failed{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}.pending,.skipped,.cancelled,.pendingImplementation{color:var(--warn);background:color-mix(in srgb,var(--warn) 11%,transparent)}.waiting{color:var(--muted);background:var(--surface-alt)}.running{color:var(--blue);background:color-mix(in srgb,var(--blue) 11%,transparent)}details{margin-top:8px}summary{width:fit-content;cursor:pointer;font-size:12px;color:var(--accent)}ul{padding-left:18px;margin:7px 0 0;color:var(--muted);font-size:12px}li{margin:3px 0;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);margin-top:24px}
    .plan-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.selection-count{font-size:17px;font-weight:600}.execution-readiness{font-size:12px;color:var(--muted)}.selection-conditions{font-size:12px;color:var(--muted);margin-bottom:16px}.plan-tools,.result-tools{display:flex;gap:12px;margin-bottom:18px}.plan-tools input,.result-tools input{flex:1}.plan-tools select,.result-tools select{width:180px}.plan-group{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin:0 0 14px}.plan-group>summary{width:100%;padding:16px 18px;color:var(--ink);font-size:15px;font-weight:600;position:relative;padding-right:130px}.plan-group>summary input{vertical-align:middle;margin:0 10px}.group-count{position:absolute;right:18px;top:18px;color:var(--muted);font-size:12px;font-weight:400}.plan-group .plan-group{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}.plan-group .plan-group>summary{font-size:13px;padding-left:30px;background:var(--surface-alt)}.plan-group .plan-operation>summary{font-weight:500;background:var(--surface);padding-left:42px}.plan-group>summary:hover{background:var(--hover)}.plan-group>summary .group-icon{display:inline-flex;width:18px;height:18px;vertical-align:middle;color:var(--accent);margin-right:8px}.test-item{padding:16px 20px;border-top:1px solid var(--line)}.test-item:has(input:checked){box-shadow:inset 3px 0 #4299ff}.test-item:has(input:enabled):hover{background:var(--surface-alt)}.test-item h3{color:var(--ink)}.plan-operation .test-item{padding-left:52px}.test-description{font-size:12px;line-height:1.7;margin:6px 0 0 28px;color:var(--muted);overflow-wrap:anywhere}.test-reasons{font-size:12px;border-left:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent);padding:9px 12px;margin:10px 0 0 28px;overflow-wrap:anywhere;color:var(--warn)}.test-reasons ul{color:inherit}.check-pending{color:var(--blue);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,transparent)}.test-context{margin:8px 0 0 28px}.test-context code{display:block;font:12px/1.7 Consolas,monospace;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
    .execution-overview{display:grid;grid-template-columns:130px minmax(0,1fr);gap:24px;align-items:center}.completion-ring{width:120px;height:120px;position:relative;display:grid;place-items:center}.completion-ring svg{width:120px;height:120px;transform:rotate(-90deg)}.ring-track{fill:none;stroke:var(--line);stroke-width:7}.ring-value{fill:none;stroke:#4299ff;stroke-width:7;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16}.ring-label{position:absolute;text-align:center;font-size:12px;color:var(--muted)}.ring-label b{display:block;color:var(--ink);font-size:25px;font-weight:650}.execution-overview .counts{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.execution-overview .metric{padding:10px}.execution-overview .metric b{font-size:23px}.api-name{font:12px/1.7 Consolas,monospace;color:var(--muted);overflow-wrap:anywhere;margin-top:5px}.api-name:empty{display:none}#execution-progress{font-weight:600;font-size:15px}.result-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.result-operation{font-size:11px;color:var(--muted);margin-bottom:4px}.result-detail{margin-top:6px;font-size:13px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}.result-description{font-size:12px;color:var(--muted);margin-top:6px}.result-extra{margin-top:8px}.result-extra details{margin-left:0}.results-list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}.results-list .test-item:first-child{border-top:0}.results-list .test-item[data-status=failed]{border-left:3px solid var(--bad)}.results-list .test-item[data-status=running]{border-left:3px solid var(--blue);background:var(--surface-alt)}.results-list .test-item[data-status=waiting] .result-heading h3{color:var(--muted)}.empty-state{text-align:center;padding:36px;color:var(--muted)}#omitted-tests{margin:20px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px}#omitted-tests>.test-item{padding:12px 0}#execution-filter-count{font-size:12px;color:var(--muted);margin-bottom:12px}
    @media(max-width:1100px){.setup-layout{grid-template-columns:1fr}.setup-layout>.overview{grid-row:1}.execution-overview .counts{grid-template-columns:repeat(4,minmax(0,1fr))}.workflow{margin:0 16px}.resource-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){:root{--header-height:111px}.appbar{padding:12px 16px}.brand small,.workflow small,.connection{display:none}.brand{font-size:15px}.workflow{gap:0;padding-bottom:10px;margin:0 8px}.workflow li{padding:0 8px;gap:7px;min-height:38px}.workflow strong{font-size:12px}.step-number{width:24px;height:24px}.appbar-actions{gap:8px}main{padding:0 16px 32px}header{padding:16px 0;gap:12px}h1{font-size:20px}.actions{gap:6px;width:100%}.actions button{padding:7px 10px;font-size:12px}.actions .primary{margin-left:auto}.resource-fields,#groups{grid-template-columns:1fr}.resource-fields .wide{grid-column:auto}.card-body,.overview{padding:16px}.counts{gap:8px}.metric{padding:10px}.metric b{font-size:22px}.plan-summary{flex-wrap:wrap;gap:6px}.plan-tools,.result-tools{gap:8px}.plan-tools select,.result-tools select{width:135px}.plan-tools input,.result-tools input{min-width:0}.plan-group>summary{font-size:14px;padding-right:115px}.group-count{right:12px;font-size:11px}.plan-group .plan-group>summary{padding-left:18px}.plan-group .plan-operation>summary{padding-left:24px}.plan-operation .test-item{padding:14px 16px 14px 28px}.test-description,.test-context,.test-reasons{margin-left:28px}.execution-overview{grid-template-columns:1fr;gap:12px}.completion-ring{display:none}.execution-overview .counts{grid-template-columns:repeat(4,minmax(0,1fr))}.result-heading{gap:8px}.test-item{padding:14px 16px}.eyebrow{display:none}}
    @media(prefers-reduced-motion:no-preference){.status.running::before{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.35}}}
    @media print{.workspace-header,header .actions,.plan-tools,.result-tools,#theme-toggle{display:none}header{position:static}body{background:#fff;color:#111}:root{--ink:#111;--muted:#444;--line:#ccc;--surface:#fff;--surface-alt:#eee;--canvas:#fff}main{max-width:none;padding:0}}
  </style>

<body>
<div class="workspace-header">
  <div class="appbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H4zM8 20h8M12 16v4M8 10l3 3 5-5"/></svg></span><span>ExHyperV <small>Core 测试</small></span></div>
    <div class="appbar-actions"><span id="connection-state" class="connection" role="status">正在连接</span><button id="theme-toggle" class="btn-quiet" aria-label="切换到浅色模式">浅色模式</button></div>
  </div>
  <ol class="workflow" aria-label="测试步骤">
    <li data-step="1" class="active" aria-current="step"><span class="step-number">1</span><span><strong>资源检查</strong><small>确认环境与设备</small></span></li>
    <li data-step="2"><span class="step-number">2</span><span><strong>选择测试</strong><small>按条件勾选项目</small></span></li>
    <li data-step="3"><span class="step-number">3</span><span><strong>执行与结果</strong><small>跟踪进度与问题</small></span></li>
  </ol>
</div>
<main>
 <div id="update-notice" class="page-notice" role="status" hidden></div>
 <div id="inspection-step">
  <header><div><div class="eyebrow">准备测试环境</div><h1>第一步：资源清单检查</h1></div>
    <div class="actions"><button id="download" disabled>下载清单</button><button id="rescan" disabled>重新检查</button><button id="save-resources" disabled>保存并检查</button><button id="next" class="primary" disabled>下一步 →</button></div>
  </header>
  <p id="deployment-summary" class="resource-help" hidden></p>
  <div class="setup-layout">
   <div id="resource-form" class="resource-form card">
    <div class="card-header"><div class="card-heading"><svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v12H4zM8 20h8M12 16v4"/></svg><h2>测试资源</h2></div><span class="resource-help">选择自动保留</span></div>
    <div class="card-body resource-fields">
      <label class="resource-field wide">测试虚拟机模板<select id="select-template"><option value="">请选择虚拟机</option></select><small>普通与 GPU 测试共用完整副本；模板正常关闭后复制，测试结束恢复运行。</small></label>
      <label class="resource-field">物理测试盘<select id="select-disk"><option value="">读取设备中…</option></select><small>选择闲置磁盘，测试期间宿主临时释放。</small><small id="disk-selection-status"></small></label>
      <label class="resource-field">测试光驱<select id="select-optical"><option value="">读取设备中…</option></select><small>用于光驱挂接测试。</small><small id="optical-selection-status"></small></label>
      <div class="resource-field wide">PCIe 测试设备<small>勾选允许用于直通测试的设备。</small><div id="pcie-selection" class="device-choices"></div></div>
      <div class="resource-field wide cache-panel">测试缓存<small id="cache-directory" class="cache-path"></small><small>自动创建，存放测试副本与文件。</small></div>
    </div>
    <p id="resource-save-state" class="resource-save-state" role="status">正在读取已保存的选择…</p>
   </div>
   <div class="overview">
    <div class="progress-label" role="status" aria-live="polite"><span id="phase">正在连接检查程序…</span><span id="progress-text">—</span></div>
    <progress id="progress" value="0" max="25" aria-label="资源检查进度"></progress>
    <div class="counts" id="counts"></div><div class="context" id="context"></div><div id="notice" role="alert"></div>
   </div>
  </div>
  <div id="groups"></div>
  <footer>资源选择将用于后续测试。</footer>
 </div>
 <div id="selection-step" hidden>
  <header><div><div class="eyebrow">安排本轮测试</div><h1 tabindex="-1" id="selection-title">第二步：选择测试项目</h1></div><div class="actions"><button id="back">← 上一步</button><button class="primary" id="begin" disabled>下一步：开始测试 →</button></div></header>
  <div class="overview plan-summary">
    <label class="choice selection-count"><input id="select-all" type="checkbox" aria-label="全选当前显示的检查点"><span id="selection-count" role="status" aria-live="polite"></span></label>
    <span id="execution-readiness" class="execution-readiness"></span>
  </div>
  <p id="selection-conditions" class="selection-conditions"></p>
  <div class="plan-tools"><input id="plan-search" type="search" aria-label="搜索测试项目" placeholder="搜索功能、API 或测试内容…"><select id="plan-filter" aria-label="筛选测试项目"><option value="all">全部项目</option><option value="ready">可执行</option><option value="resources">资源待准备</option><option value="checks">条件检查待接入</option><option value="implementation">执行代码待接入</option><option value="selected">已勾选</option></select></div>
  <div id="selection-notice" class="page-notice" role="alert"></div>
  <div id="plan-groups"></div>
  <p id="plan-empty" class="empty-state" hidden>当前筛选下没有项目。</p>
 </div>
 <div id="execution-step" hidden>
  <header><div><div class="eyebrow">本轮测试</div><h1 tabindex="-1" id="execution-title">第三步：执行 API 测试</h1></div><div class="actions"><button id="execution-back">← 返回选择</button><button id="download-test" disabled>下载结果</button><button id="stop-test" disabled>停止测试</button></div></header>
  <div class="overview execution-overview">
    <div class="completion-ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="50"/><circle id="execution-ring" class="ring-value" cx="60" cy="60" r="50"/></svg><span class="ring-label"><b id="execution-percent">0%</b>已结束</span></div>
    <div>
      <div class="progress-label"><span id="execution-progress" role="status" aria-live="polite"></span><span id="execution-total"></span></div>

        ui={row,badge,detail,details,summary,list,serialized:null,search:'',status:''};results.set(item.id,ui);
      }
      ui.row.dataset.status=item.status;ui.status=item.status;
      ui.search=[item.name,item.api,item.description,item.detail,...item.evidence].join(' ').toLowerCase();
      ui.badge.className='status '+item.status;ui.badge.textContent=testLabels[item.status]||item.status;ui.detail.textContent=item.detail;
      ui.detail.hidden=item.status==='waiting'&&item.detail==='等待执行';
      const serialized=JSON.stringify(item.evidence);
      if(ui.serialized!==serialized){ui.details.hidden=item.evidence.length===0;ui.summary.textContent='结果明细（'+item.evidence.length+'）';ui.list.replaceChildren(...item.evidence.map(text=>node('li','',text)));ui.serialized=serialized;}
    }
    filterResults();controls();
  }
  function filterResults(){
    const words=$('result-search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),filter=$('result-filter').value;
    let visible=0;
    for(const ui of results.values()){
      ui.row.hidden=(filter!=='all'&&ui.status!==filter)||words.some(word=>!ui.search.includes(word));
      if(!ui.row.hidden)visible++;
    }
    $('execution-filter-count').textContent='显示 '+visible+' / '+results.size+' 项';
    $('results-empty').hidden=visible>0;$('test-results').hidden=visible===0;
  }
  async function getJson(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('读取状态失败：'+response.status);return response.json();}
  async function post(path,body){
    const response=await fetch(path,{method:'POST',headers:{'X-Inspection-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
    if(!response.ok){let message='请求失败：'+response.status;try{message=(await response.json()).error||message;}catch{}throw Error(message);}
    return response;
  }
  async function refresh(){
    try{
      let pageChanged=false;
      if(loadedSession){
        const session=await getJson('/api/session');
        if(session.instanceId!==loadedSession.instanceId){reloadPage();return;}
        pageChanged=session.pageRevision!==loadedSession.pageRevision;
        $('update-notice').textContent=session.updateError||(session.restarting?'正在更新程序…':'');
        $('update-notice').hidden=!$('update-notice').textContent;
      }
      render(await getJson('/api/report'));if(!registration)applyRegistration(await getJson('/api/resources'));renderTest(await getJson('/api/tests'));restoreView();
      if(deployment){const setup=await getJson('/api/deployment');deploymentReady=setup.issues.length===0;$('deployment-summary').textContent=latest.running?'正在检查测试条件…':deploymentReady?'当前可执行 '+setup.available+' 项；其余项目按资源条件跳过。选择会保存，后续自动复用。':setup.issues.join('；');controls();}
      if(pageChanged&&!latest.running&&!latestTest?.running&&!startBusy&&!scanBusy&&!stopBusy&&!resourceDirty&&!resourceSaveBusy)reloadPage();
    }
    catch(error){if(!deploymentFinished){connected=false;$('phase').textContent='连接已断开';$('notice').textContent='显示上次结果，请检查后台程序。';$('execution-notice').textContent='连接已断开，显示上次测试状态。';controls();}}
    finally{if(!deploymentFinished)setTimeout(refresh,1000);}
  }
  function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download=name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  $('result-search').addEventListener('input',filterResults);$('result-filter').addEventListener('change',filterResults);
  $('resource-form').addEventListener('input',()=>{resourceDirty=true;resourceMessage('设置已修改，请点上方“保存并检查”。');controls();});
  $('save-resources').addEventListener('click',async()=>{
    if($('save-resources').disabled)return;resourceSaveBusy=true;controls();resourceMessage('正在保存并检查…');
    try{
      const response=await post('/api/resources',{revision:registration.revision,resourceRunId:latest.runId,templateVmId:$('select-template').value,pcieIds:[...$('pcie-selection').querySelectorAll('input:checked')].map(input=>input.value),physicalDiskId:$('select-disk').value,opticalDriveId:$('select-optical').value});
      applyRegistration(await response.json());resourceMessage('已保存，正在按新选择检查资源；下次启动自动复用。');render(await getJson('/api/report'));
    }catch(error){resourceMessage(error.message,true);}
    finally{resourceSaveBusy=false;controls();}
  });
  $('rescan').addEventListener('click',async()=>{
    scanBusy=true;controls();
    try{await post('/api/scan');render(await getJson('/api/report'));}catch(error){$('notice').textContent=error.message;}
    finally{scanBusy=false;controls();}
  });
  $('download').addEventListener('click',()=>{if(latest)download(latest,'资源清单-'+latest.runId);});
  $('next').addEventListener('click',async()=>{
    if($('next').disabled)return;
    if(!deployment){showStep(2);return;}
    startBusy=true;controls();
    try{const response=await post('/api/deployment/complete');const result=await response.json();deploymentFinished=true;resourceMessage(result.message);$('next').textContent='已完成';$('phase').textContent='部署资源已确认';}
    catch(error){resourceMessage(error.message,true);}
    finally{startBusy=false;controls();}
  });
  $('back').addEventListener('click',()=>showStep(1));
  $('select-all').addEventListener('change',()=>{for(const [id,choice] of choices)if(choice.eligible&&!choice.row.hidden){if($('select-all').checked)selection.add(id);else selection.delete(id);}updateSelection();});
  $('plan-search').addEventListener('input',filterPlan);$('plan-filter').addEventListener('change',filterPlan);
  $('begin').addEventListener('click',async()=>{
    if($('begin').disabled)return;
    startBusy=true;$('selection-notice').textContent='';controls();
    try{const response=await post('/api/tests',{resourceRunId:latest.runId,requestId:crypto.randomUUID(),checkIds:[...selection]});renderTest(await response.json());showStep(3);}
    catch(error){$('selection-notice').textContent=error.message;}
    finally{startBusy=false;controls();}
  });
  $('execution-back').addEventListener('click',()=>showStep(2));
  $('download-test').addEventListener('click',()=>{if(latestTest)download(latestTest,'API测试-'+latestTest.runId);});
  $('stop-test').addEventListener('click',async()=>{
    stopBusy=true;controls();
    try{await post('/api/tests/'+encodeURIComponent(latestTest.runId)+'/cancel');renderTest(await getJson('/api/tests'));}
    catch(error){$('execution-notice').textContent=error.message;}
    finally{stopBusy=false;controls();}
  });
  if(archivedReport){
    $('resource-form').hidden=true;$('save-resources').hidden=true;
    render(archivedReport);$('rescan').hidden=true;$('selection-notice').textContent='这是保存的报告；实际执行请使用本机检查页面。';
    renderTest(archivedTest);
  }else refresh();
</script>
</body>
</html>
