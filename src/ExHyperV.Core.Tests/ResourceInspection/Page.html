<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">

  <style nonce="__NONCE__">__TABLER_CSS__</style>
  <style nonce="__NONCE__">

    [hidden]{display:none!important}

    .choice:has(input:disabled){cursor:default}.cache-path{font-size:.75rem;overflow-wrap:anywhere;color:var(--tblr-secondary)}

    .resource-row .detail{padding-top:.5rem;font-size:.75rem;color:var(--tblr-secondary);overflow-wrap:anywhere}
    .resource-detail>summary{color:var(--tblr-body-color)}.resource-detail .full-detail{margin-top:.5rem;color:var(--tblr-secondary)}
    .resource-row .detail details{margin-top:.375rem}.resource-row[data-status=missing],.resource-row[data-status=unavailable]{border-left:2px solid var(--tblr-red)}
    .resource-row[data-status=pending]{border-left:2px solid var(--tblr-yellow)}.resource-row .badge{font-weight:500;white-space:nowrap;font-size:.6875rem}
    .context,.selection-conditions{font-size:.75rem;color:var(--tblr-secondary)}
    .page-notice,#notice{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--tblr-red);font-size:.8125rem;margin-block:.75rem}
    .page-notice:empty,#notice:empty{display:none}
    details>summary{cursor:pointer}details>summary:focus-visible{outline-offset:-2px}
    ul{padding-left:1.25rem;margin:.5rem 0 0}li{overflow-wrap:anywhere}
    .plan-toolbar,.result-tools{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .plan-tools{display:flex;gap:.5rem;margin-left:auto}.plan-tools input,.result-tools input{width:260px}.plan-tools select,.result-tools select{width:155px}
    .selection-count{align-items:center;font-weight:500;white-space:nowrap}.selection-count input{margin:0}
    .selection-conditions{margin:0 0 1rem}.plan-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:1.5rem;align-items:start}
    .plan-nav{position:sticky;top:1rem;gap:.25rem;flex-direction:column}.plan-nav .nav-link{display:flex;align-items:center;gap:.625rem;text-align:left;min-width:0;border:0;white-space:normal}
    .plan-nav .nav-link span:last-child{margin-left:auto;font-size:.75rem;opacity:.65}
    .plan-group{scroll-margin-top:1rem}.plan-group>summary{display:flex;align-items:center;gap:.625rem;list-style:none;padding:1rem 1.25rem;min-width:0;font-weight:500}
    .plan-group>summary::-webkit-details-marker{display:none}.plan-group>summary::before{content:"›";color:var(--tblr-secondary);font-size:1.125rem}
    .plan-group[open]>summary::before{transform:rotate(90deg)}.plan-group>summary .group-count{margin-left:auto;font-size:.75rem;color:var(--tblr-secondary);white-space:nowrap}
    .plan-group>summary input{flex-shrink:0}.plan-group>summary:hover{background:var(--tblr-bg-surface-secondary)}
    .plan-group .plan-group{border-top:1px solid var(--tblr-border-color)}.plan-group .plan-group>summary{padding-block:.75rem;font-size:.8125rem;padding-left:calc(1.25rem + var(--group-depth)*.75rem)}
    #plan-groups>.plan-group{margin-bottom:1rem}.group-icon{display:inline-flex}

    .test-description,.test-context,.test-reasons{font-size:.8125rem;margin:.5rem 0 0 1.625rem;color:var(--tblr-secondary)}

    .result-detail{font-size:.8125rem;margin:.375rem 0 0;overflow-wrap:anywhere;white-space:pre-wrap}.result-description,.result-extra{font-size:.8125rem;color:var(--tblr-secondary);margin:.5rem 0 0}
    .result-extra{margin:0}.result-extra>summary{position:absolute;top:1rem;right:1.25rem}.result-extra[open]{margin-top:.75rem}.result-extra .test-context{margin-left:0}.results-list .test-item:first-child{border-top:0}.results-list .test-item[data-status=failed]{border-left:3px solid var(--tblr-red)}
    .results-list .test-item[data-status=running]{border-left:3px solid var(--tblr-primary);background:var(--tblr-bg-surface-secondary)}
    .results-list .test-item[data-status=waiting] .result-heading h3{color:var(--tblr-secondary)}
    #omitted-tests{padding:1rem 1.25rem}#omitted-list .test-item{padding-inline:0;margin-top:1rem;font-size:.8125rem}

    @media(max-width:1199px){.setup-layout{grid-template-columns:minmax(260px,1fr) minmax(0,1.6fr)}#groups{grid-template-columns:1fr}}
    @media(max-width:767px){.workflow{flex-direction:row;gap:.5rem;justify-content:space-between;width:100%}.workflow .nav-link{padding:.75rem .25rem}.app-navbar .connection{display:none}.page-header{padding-block:1rem}.page-header .actions{margin-top:1rem}.counts{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.setup-layout,.plan-layout{grid-template-columns:1fr}.resource-form,.plan-nav{position:static}.plan-nav{flex-direction:row;overflow-x:auto;flex-wrap:nowrap}.plan-nav .nav-link{flex-shrink:0}.plan-tools,.result-tools{width:100%;margin-left:0}.plan-tools input{flex:1;min-width:0}.plan-tools select,.result-tools select{width:130px}.plan-toolbar{gap:.75rem}.plan-group>summary{padding:1rem}.plan-group>summary .group-count{font-size:.6875rem}.plan-operation .test-item{padding-left:1.25rem}.inspection-summary .context{margin-left:0;width:100%}.execution-counts{grid-template-columns:repeat(3,minmax(0,1fr))}.result-tools input{min-width:0}.result-tools #execution-filter-count{width:100%}.page-title{font-size:1.125rem}}
    @media(max-width:767px){.page-header .row{display:block}.page-header .actions{justify-content:flex-end}.plan-nav{max-width:100%;min-width:0}}
    @media print{.app-navbar,.workflow-navbar,.actions,.plan-tools,.result-tools,.plan-nav{display:none!important}.resource-form{position:static}.plan-layout{display:block}.page-wrapper{margin:0}}
  </style>
</head>
<body>
<div class="page">
  <header class="navbar navbar-expand-md app-navbar d-print-none">
    <div class="container-xl">
      <div class="navbar-brand"><svg class="icon brand-icon text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H4zM8 20h8M12 16v4M8 10l3 3 5-5"/></svg>ExHyperV<span class="badge bg-blue-lt ms-2">Core 测试</span></div>
      <div class="navbar-nav flex-row align-items-center gap-3"><span id="connection-state" class="connection" role="status">连接中</span><button id="theme-toggle" class="btn btn-icon btn-ghost-secondary" aria-label="切换到浅色模式" title="切换主题"></button></div>
    </div>
  </header>
  <nav class="navbar navbar-expand-md workflow-navbar" aria-label="测试步骤">
    <div class="container-xl"><ul class="navbar-nav flex-row workflow">
      <li data-step="1" class="nav-item active" aria-current="step"><button class="nav-link" id="nav-resources"><span class="step-number">01</span>资源检查</button></li>
      <li data-step="2" class="nav-item"><button class="nav-link" id="nav-selection" disabled><span class="step-number">02</span>选择测试</button></li>
      <li data-step="3" class="nav-item"><button class="nav-link" id="nav-results" disabled><span class="step-number">03</span>执行与结果</button></li>
    </ul></div>
  </nav>
  <div class="page-wrapper"><main class="container-xl pb-5">
    <div id="update-notice" class="page-notice" role="status" hidden></div>
    <section id="inspection-step">
      <header class="page-header"><div class="row align-items-center"><div class="col"><h1 class="page-title">第一步：资源清单检查</h1></div><div class="col-auto ms-auto actions"><button class="btn" id="download" disabled>导出</button><button class="btn" id="rescan" disabled>重新检查</button><button class="btn" id="save-resources" disabled>保存并检查</button><button class="btn btn-primary" id="next" disabled>下一步 <span aria-hidden="true">→</span></button></div></div></header>
      <p id="deployment-summary" class="text-secondary" hidden></p>
      <div class="counts" id="counts"></div>
      <div class="inspection-summary"><span id="phase" role="status" aria-live="polite">连接中</span><span id="progress-text" class="text-secondary">—</span><progress id="progress" value="0" max="25" aria-label="资源检查进度"></progress><span class="context" id="context"></span></div>
      <div id="notice" role="alert"></div>
      <div class="setup-layout">
        <section id="resource-form" class="resource-form card">
          <div class="card-header"><h2 class="card-title">测试资源</h2></div>
          <div class="card-body resource-fields">
            <label class="resource-field"><span class="form-label">虚拟机模板</span><select class="form-select" id="select-template" title="复制模板用于测试，结束后恢复模板运行状态。"><option value="">请选择虚拟机</option></select></label>
            <label class="resource-field"><span class="form-label">物理测试盘</span><select class="form-select" id="select-disk" title="选择闲置磁盘，测试期间宿主临时释放。"><option value="">读取中…</option></select><small id="disk-selection-status"></small></label>
            <label class="resource-field"><span class="form-label">光驱</span><select class="form-select" id="select-optical"><option value="">读取中…</option></select><small id="optical-selection-status"></small></label>
            <div class="resource-field"><div class="form-label">PCIe 设备</div><div id="pcie-selection" class="device-choices"></div></div>
          </div>
          <div class="card-footer"><div class="text-secondary small mb-1">缓存目录</div><div id="cache-directory" class="cache-path"></div></div>
          <p id="resource-save-state" class="resource-save-state" role="status">加载中…</p>
        </section>
        <div id="groups"></div>
      </div>
    </section>
    <section id="selection-step" hidden>
      <header class="page-header"><div class="row align-items-center"><div class="col"><h1 class="page-title" tabindex="-1" id="selection-title">第二步：选择测试项目</h1></div><div class="col-auto ms-auto actions"><button class="btn" id="back">上一步</button><button class="btn btn-primary" id="begin" disabled>开始测试 <span aria-hidden="true">→</span></button></div></div></header>
      <div class="card mb-3"><div class="card-body plan-toolbar"><label class="choice selection-count"><input class="form-check-input" id="select-all" type="checkbox" aria-label="全选当前显示的检查点"><span id="selection-count" role="status" aria-live="polite"></span></label><div class="plan-tools"><input class="form-control" id="plan-search" type="search" aria-label="搜索测试项目" placeholder="搜索测试…"><select class="form-select" id="plan-filter" aria-label="筛选测试项目"><option value="all">全部项目</option><option value="ready">可执行</option><option value="resources">缺少资源</option><option value="checks">检查待接入</option><option value="implementation">执行待接入</option><option value="selected">已勾选</option></select></div></div></div>
      <p id="selection-conditions" class="selection-conditions"></p>
      <div id="selection-notice" class="page-notice" role="alert"></div>
      <div class="plan-layout"><nav id="plan-nav" class="nav nav-pills plan-nav" aria-label="测试分类"></nav><div><div id="plan-groups"></div><div id="plan-empty" class="empty" hidden><p class="empty-title">没有匹配项目</p></div></div></div>
    </section>
    <section id="execution-step" hidden>
      <header class="page-header"><div class="row align-items-center"><div class="col"><h1 class="page-title" tabindex="-1" id="execution-title">第三步：执行 API 测试</h1></div><div class="col-auto ms-auto actions"><button class="btn" id="execution-back">返回选择</button><button class="btn" id="download-test" disabled>导出结果</button><button class="btn btn-outline-danger" id="stop-test" disabled>停止</button></div></div></header>
      <div class="counts execution-counts mb-3" id="execution-counts"></div>
      <div class="card execution-overview mb-3"><div class="card-body">
        <div class="progress-label"><span id="execution-progress" role="status" aria-live="polite"></span><span><strong id="execution-percent">0%</strong><span class="text-secondary ms-3" id="execution-total"></span></span></div>
        <progress id="test-progress" value="0" max="1" aria-label="测试执行进度"></progress>
        <div class="api-name" id="execution-api"></div>
        <details class="mt-2"><summary class="text-secondary small">运行信息</summary><div class="context mt-2" id="execution-context"></div></details>
        <div class="page-notice" id="execution-notice" role="alert"></div>
      </div></div>
      <div class="card"><div class="card-header result-tools"><input class="form-control" id="result-search" type="search" aria-label="搜索测试结果" placeholder="搜索结果…"><select class="form-select" id="result-filter" aria-label="筛选测试结果"><option value="all">全部结果</option><option value="running">执行中</option><option value="failed">失败</option><option value="skipped">跳过</option><option value="passed">通过</option><option value="waiting">等待</option><option value="cancelled">已停止</option><option value="pendingImplementation">待接入</option></select><span id="execution-filter-count"></span></div>
        <div class="results-list" id="test-results"></div><div id="results-empty" class="empty" hidden><p class="empty-title">没有匹配结果</p></div>
      </div>
      <details id="omitted-tests" class="card mt-3" hidden><summary id="omitted-title"></summary><div id="omitted-list"></div></details>
    </section>
  </main></div>
</div>
<script nonce="__NONCE__">
  const archivedReport = __REPORT__, archivedTest = __TEST_REPORT__, loadedSession = __SESSION__, token = '__NONCE__';
  const labels = {waiting:'等待检查',running:'正在检查',ready:'已满足',missing:'未满足',pending:'待选择',unavailable:'无法检查'};
  const testLabels = {waiting:'等待',running:'执行中',passed:'通过',failed:'失败',skipped:'跳过',cancelled:'已停止',pendingImplementation:'待接入'};
  const elements = new Map(), choices = new Map(), results = new Map(), selection = new Set(), seenOptions = new Set(), planGroups = new Map();
  const resourceSections=[],resourceColumnsMedia=window.matchMedia?.('(min-width:1200px)');
  let resourceLayoutKey='';
  let latest=null, latestTest=null, connected=false, planKey='', planRunId=null, testRunId=null, startBusy=false, scanBusy=false, stopBusy=false, currentStep=1, restoredView=null, registration=null, resourceDirty=false, resourceSaveBusy=false, resourceChoicesKey='';
  if(!archivedReport){try{restoredView=JSON.parse(sessionStorage.getItem('inspection-view'));sessionStorage.removeItem('inspection-view');}catch{}}
  const $ = id => document.getElementById(id);
  const deployment=loadedSession?.deployment===true;
  let deploymentFinished=false,deploymentReady=false;
  if(deployment){document.querySelector('#inspection-step h1').textContent='部署：选择资源';$('next').textContent='完成部署';$('deployment-summary').hidden=false;restoredView=null;}
  function node(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n;}
  function applyTheme(theme){
    document.documentElement.dataset.bsTheme=theme;
    const label=theme==='dark'?'浅色模式':'暗黑模式';
    $('theme-toggle').replaceChildren(symbol(theme==='dark'?'sun':'moon'));
    $('theme-toggle').setAttribute('aria-label','切换到'+label);$('theme-toggle').title=label;
  }
  let preferredTheme='dark';
  try{if(localStorage.getItem('exhyperv-tests-theme')==='light')preferredTheme='light';}catch{}
  applyTheme(preferredTheme);
  $('theme-toggle').addEventListener('click',()=>{
    const theme=document.documentElement.dataset.bsTheme==='dark'?'light':'dark';applyTheme(theme);
    try{localStorage.setItem('exhyperv-tests-theme',theme);}catch{}
  });
  if(deployment)document.body.classList.add('deployment');
  function statusColor(status){return ['ready','passed'].includes(status)?'green':['missing','failed','unavailable'].includes(status)?'red':['pending','skipped','cancelled','pendingImplementation'].includes(status)?'yellow':status==='running'?'blue':'secondary';}
  function symbol(name){
    const paths={sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5',moon:'M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5z',check:'m5 12 4 4L19 6',cross:'m6 6 12 12M6 18 18 6',pending:'M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3M12 17v.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',clock:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18'};
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),path=document.createElementNS('http://www.w3.org/2000/svg','path');
    for(const [key,value] of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'1.7','stroke-linecap':'round','stroke-linejoin':'round',class:'icon','aria-hidden':'true'}))svg.setAttribute(key,value);
    path.setAttribute('d',paths[name]||paths.clock);svg.append(path);return svg;
  }
  function metric(status,label,count){
    const element=node('div','card metric'),body=node('div','card-body'),icon=node('span','avatar bg-'+statusColor(status)+'-lt'),text=node('div');element.dataset.status=status;
    icon.append(symbol(['ready','passed'].includes(status)?'check':['missing','failed','unavailable'].includes(status)?'cross':status==='pending'?'pending':'clock'));
    text.append(node('b','text-'+statusColor(status),String(count)),node('span','metric-label',label));body.append(icon,text);element.append(body);return element;
  }

  async function getJson(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('读取状态失败：'+response.status);return response.json();}
  async function post(path,body){
    const response=await fetch(path,{method:'POST',headers:{'X-Inspection-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
    if(!response.ok){let message='请求失败：'+response.status;try{message=(await response.json()).error||message;}catch{}throw Error(message);}
    return response;
  }
  async function refresh(){
    try{
      let pageChanged=false;
      if(loadedSession){
        const session=await getJson('/api/session');
        if(session.instanceId!==loadedSession.instanceId){reloadPage();return;}
        pageChanged=session.pageRevision!==loadedSession.pageRevision;
        $('update-notice').textContent=session.updateError||(session.restarting?'正在更新程序…':'');
        $('update-notice').hidden=!$('update-notice').textContent;
      }
      render(await getJson('/api/report'));if(!registration)applyRegistration(await getJson('/api/resources'));renderTest(await getJson('/api/tests'));restoreView();
      if(deployment){const setup=await getJson('/api/deployment');deploymentReady=setup.issues.length===0;$('deployment-summary').textContent=latest.running?'正在检查测试条件…':deploymentReady?'当前可执行 '+setup.available+' 项；其余项目按资源条件跳过。选择会保存，后续自动复用。':setup.issues.join('；');controls();}
      if(pageChanged&&!latest.running&&!latestTest?.running&&!startBusy&&!scanBusy&&!stopBusy&&!resourceDirty&&!resourceSaveBusy)reloadPage();
    }
    catch(error){if(!deploymentFinished){connected=false;$('phase').textContent='连接已断开';$('notice').textContent='显示上次结果，请检查后台程序。';$('execution-notice').textContent='连接已断开，显示上次测试状态。';controls();}}
    finally{if(!deploymentFinished)setTimeout(refresh,1000);}
  }
  function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download=name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  $('nav-resources').addEventListener('click',()=>{if(!$('nav-resources').disabled)showStep(1);});
  $('nav-selection').addEventListener('click',()=>{if(!$('nav-selection').disabled)showStep(2);});
  $('nav-results').addEventListener('click',()=>{if(!$('nav-results').disabled)showStep(3);});
  $('result-search').addEventListener('input',filterResults);$('result-filter').addEventListener('change',filterResults);
  $('resource-form').addEventListener('input',()=>{resourceDirty=true;resourceMessage('待保存');controls();});
  $('save-resources').addEventListener('click',async()=>{
    if($('save-resources').disabled)return;resourceSaveBusy=true;controls();resourceMessage('保存中…');
    try{
      const response=await post('/api/resources',{revision:registration.revision,resourceRunId:latest.runId,templateVmId:$('select-template').value,pcieIds:[...$('pcie-selection').querySelectorAll('input:checked')].map(input=>input.value),physicalDiskId:$('select-disk').value,opticalDriveId:$('select-optical').value});
      applyRegistration(await response.json());resourceMessage('已保存，检查中…');render(await getJson('/api/report'));
    }catch(error){resourceMessage(error.message,true);}
    finally{resourceSaveBusy=false;controls();}
  });
  $('rescan').addEventListener('click',async()=>{
    scanBusy=true;controls();
    try{await post('/api/scan');render(await getJson('/api/report'));}catch(error){$('notice').textContent=error.message;}
    finally{scanBusy=false;controls();}
  });
  $('download').addEventListener('click',()=>{if(latest)download(latest,'资源清单-'+latest.runId);});
  $('next').addEventListener('click',async()=>{
    if($('next').disabled)return;
    if(!deployment){showStep(2);return;}
    startBusy=true;controls();
    try{const response=await post('/api/deployment/complete');const result=await response.json();deploymentFinished=true;resourceMessage(result.message);$('next').textContent='已完成';$('phase').textContent='部署资源已确认';}
    catch(error){resourceMessage(error.message,true);}
    finally{startBusy=false;controls();}
  });
  $('back').addEventListener('click',()=>showStep(1));
  $('select-all').addEventListener('change',()=>{for(const [id,choice] of choices)if(choice.eligible&&!choice.row.hidden){if($('select-all').checked)selection.add(id);else selection.delete(id);}updateSelection();});
  $('plan-search').addEventListener('input',filterPlan);$('plan-filter').addEventListener('change',filterPlan);
  $('begin').addEventListener('click',async()=>{
    if($('begin').disabled)return;
    startBusy=true;$('selection-notice').textContent='';controls();
    try{const response=await post('/api/tests',{resourceRunId:latest.runId,requestId:crypto.randomUUID(),checkIds:[...selection]});renderTest(await response.json());showStep(3);}
    catch(error){$('selection-notice').textContent=error.message;}
    finally{startBusy=false;controls();}
  });
  $('execution-back').addEventListener('click',()=>showStep(2));
  $('download-test').addEventListener('click',()=>{if(latestTest)download(latestTest,'API测试-'+latestTest.runId);});
  $('stop-test').addEventListener('click',async()=>{
    stopBusy=true;controls();
    try{await post('/api/tests/'+encodeURIComponent(latestTest.runId)+'/cancel');renderTest(await getJson('/api/tests'));}
    catch(error){$('execution-notice').textContent=error.message;}
    finally{stopBusy=false;controls();}
  });
  if(archivedReport){
    $('resource-form').hidden=true;$('save-resources').hidden=true;
    render(archivedReport);$('rescan').hidden=true;$('selection-notice').textContent='这是保存的报告；实际执行请使用本机检查页面。';
    renderTest(archivedTest);
  }else refresh();
</script>
</body>
</html>
