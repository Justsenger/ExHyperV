(() => {
  'use strict';
  // Match the website's automatic interface language, including live browser changes.
  const updateTitle = () => {
    const language = (navigator.languages?.[0] || navigator.language || 'zh-CN').replaceAll('_','-').toLowerCase();
    document.title = language.startsWith('zh')
      ? (/tw|hk|hant/.test(language) ? 'API 文件' : 'API 文档')
      : 'API Documentation';
  };
  updateTitle();
  window.addEventListener('languagechange',updateTitle);

<script id="theme-init">
(() => {
  'use strict';
  const onWebsite = /^https?:$/.test(location.protocol) && /^\/api(?:\/|$)/.test(location.pathname);
  document.documentElement.dataset.siteContext = onWebsite ? 'website' : 'standalone';
  const key = 'exhyperv-doc-theme';
  const normalize = value => ['system','light','dark'].includes(value) ? value : 'system';
  const media = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let preference = 'system';
  try { preference = normalize(localStorage.getItem(key)); } catch {}
  const apply = () => {
    document.documentElement.dataset.theme = preference === 'system' ? (media?.matches ? 'dark' : 'light') : preference;
  };
  // Set the palette before the first paint, including when storage is unavailable.
  apply();
  document.addEventListener('DOMContentLoaded', () => {
    if (onWebsite) {
      document.querySelector('[data-site-navigation]').hidden = false;
      const home = document.querySelector('[data-site-home]');
      home.href = '/';
      home.setAttribute('aria-label', 'ExHyperV 首页');
    }
    const selector = document.getElementById('theme-select');
    selector.value = preference;
    apply();
    selector.addEventListener('change', () => {
      preference = normalize(selector.value);
      apply();
      try { localStorage.setItem(key, preference); } catch {}
    });
    const systemChanged = () => { if (preference === 'system') apply(); };
    if (media?.addEventListener) media.addEventListener('change', systemChanged);
    else if (media?.addListener) media.addListener(systemChanged);
    window.addEventListener('storage', event => {
      if (event.key !== key && event.key !== null) return;
      preference = normalize(event.newValue);
      selector.value = preference;
      apply();
    });
  });
})();
</script>

<script type="application/json" id="api-data">__API_DATA__</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('api-data').textContent);
  const types = data.types || [];
  const designs = data.designs || [];
  const designMap = new Map(designs.map(design => [design.id, design]));
  const typeMap = new Map(types.map(type => [type.id, type]));
  const memberMap = new Map();
  for (const type of types) for (const member of type.members || []) memberMap.set(member.id, {type, member});
  // A field that already explains an enum owns its documentation. Keep old type
  // and value URLs as aliases, so callers and saved links reach the same card.
  const fieldsByEnum = new Map();
  const fieldsByExpression = new Map();
  for (const {member} of memberMap.values()) if (member.queryField) {
    fieldsByExpression.set(member.queryField.expression,member);
    const enumId = member.queryField.enumTypeId;
    if (enumId) {
      if (!fieldsByEnum.has(enumId)) fieldsByEnum.set(enumId,[]);
      fieldsByEnum.get(enumId).push(member);
    }
  }
  const enumOwners = new Map([...fieldsByEnum].filter(([,fields]) => fields.length === 1)
    .map(([id,fields]) => [id,fields[0]]));
  const referenceTargets = new Map();
  for (const [enumId,field] of enumOwners) {
    referenceTargets.set(enumId,field.id);
    for (const value of typeMap.get(enumId)?.members || [])
      referenceTargets.set(value.id,`${field.id}--${value.id}`);
  }
  const referenceTarget = id => referenceTargets.get(id) || referenceTargets.get(id.split('--')[0]) || id;
  const referenceLinks = html => html.replace(/href="#([^"]+)"/g,(_,id) => `href="#${referenceTarget(id)}"`);
  const main = document.getElementById('main-content');
  const navigation = document.getElementById('navigation');
  const search = document.getElementById('api-search');
  const clearSearch = document.getElementById('clear-search');
  const menu = document.getElementById('mobile-menu');
  const categories = data.categories || [];
  const categoryMap = new Map(categories.map(category => [category.id,category]));
  const pathKey = path => path.join(' / ');
  const displayPath = path => path[0] === '管理层面' && ['虚拟机','宿主'].includes(path[1]) && ['查询','修改'].includes(path[2])
    ? [...path.slice(0,2), ...path.slice(3)] : path;
  const typePaths = type => type.navigationPaths || [];
  const memberPaths = member => member.navigationPaths || [member.navigationPath || []];
  const belongsTo = (type,path) => typePaths(type).some(item => pathKey(item) === pathKey(path));
  const membersIn = (type,path) => (type.members || []).filter(member => memberPaths(member).some(item => pathKey(item) === pathKey(path)));
  const insideArea = (path,area) => !area || pathKey(path) === area || pathKey(path).startsWith(area + ' / ');
  const queryPath = data.queryPath || ['管理层面','虚拟机','查询'];
  const queryKey = pathKey(queryPath);
  const queryTypes = types.filter(type => typePaths(type).some(path => insideArea(path,queryKey)));
  const queryMethod = queryTypes.find(type => type.shortName === 'VmQueryService').members.find(member => member.name === 'QueryAsync');
  const queryEntries = types.flatMap(type => (type.members || []).filter(member => member.queryEntry).map(member => ({type,member,...member.queryEntry})));
  const queryGroups = categories.filter(category => insideArea(category.path,queryKey) && category.path.length > queryPath.length).map(category => ({
    ...category,
    entries: queryEntries.filter(entry => entry.category === category.path.at(-1)),
    fields: types.flatMap(type => (type.members || []).filter(member => member.queryField && pathKey(member.navigationPath) === category.area).map(member => ({type,member,...member.queryField})))
      .sort((left,right) => Number(left.type.shortName === 'VmAffinityFields') - Number(right.type.shortName === 'VmAffinityFields') || left.type.source.localeCompare(right.type.source,'en') || left.order - right.order)
  })).filter(group => group.fields.length || group.entries.length);
  const vmQueryFields = queryGroups.flatMap(group => group.fields);
  const queryFields = types.flatMap(type => (type.members || []).filter(member => member.queryField).map(member => ({type,member,...member.queryField})));
  const hostPath = ['管理层面','宿主'];
  const hostKey = pathKey(hostPath);
  const hostEntries = types.flatMap(type => (type.members || []).filter(member => member.hostEntry).map(member => ({type,member,...member.hostEntry}))).sort((a,b) => a.order-b.order);
  const hostEntryMap = new Map(hostEntries.map(entry => [entry.member.id,entry]));
  const hostGroups = area => categories.filter(category => category.path.length === 4 && category.path[1] === '宿主' && category.path[2] === area)
    .map(category => ({...category,entries:hostEntries.filter(entry => entry.area === area && entry.category === category.path[3])})).filter(group => group.entries.length);
  const hostReadGroups = hostGroups('查询'), hostWriteGroups = hostGroups('修改');
  const hostGroupQuery = hostReadGroups.find(group => group.path.at(-1) === '分组');
  const hostGroupModification = hostWriteGroups.find(group => group.path.at(-1) === '分组');
  const hostGroupFields = queryFields.filter(field => field.member.navigationPath[1] === '宿主');
  const hostCategoryPages = new Map(categories.filter(category => category.path[1] === '宿主').map(category => [category.id,category.path[2] === '修改' ? 'host-modification' : 'host-query']));
  const queryFieldMap = new Map(queryFields.map(field => [field.member.id,field]));
  const queryCategoryIds = new Set(categories.filter(category => insideArea(category.path,queryKey)).map(category => category.id));
  const modificationPath = [...queryPath.slice(0,-1),'修改'];
  const modificationKey = pathKey(modificationPath);
  const modificationFields = queryFields.map(field => ({...field,id:'modify-' + field.member.id,change:field.member.modification}));
  const modificationFieldMap = new Map(modificationFields.map(field => [field.id,field]));
  const editableFields = modificationFields.filter(field => ['supported','unavailable'].includes(field.change.kind));
  const allModificationActions = types.flatMap(type => (type.members || []).filter(member => member.editEntry).map(member => ({type,member,...member.editEntry})));
  const modificationActions = allModificationActions.filter(action => memberPaths(action.member).some(path => insideArea(path,modificationKey)));
  const modificationGroups = categories.filter(category => insideArea(category.path,modificationKey) && category.path.length > modificationPath.length).map(group => ({...group,
    fields:editableFields.filter(field => field.category === group.path.at(-1)).sort((left,right) => Number(left.type.shortName === 'VmAffinityFields') - Number(right.type.shortName === 'VmAffinityFields') || left.type.source.localeCompare(right.type.source,'en') || left.order - right.order),
    actions:modificationActions.filter(action => action.category === group.path.at(-1)).sort((left,right) => left.order-right.order)
  }));
  const modificationCategoryIds = new Set(categories.filter(category => insideArea(category.path,modificationKey)).map(category => category.id));
  const instancePath = [...queryPath.slice(0,-1),'实例'];
  const instanceKey = pathKey(instancePath);
  const instanceEntries = types.flatMap(type => (type.members || []).filter(member => member.instanceEntry).map(member => ({type,member,id:'instance-' + member.id,...member.instanceEntry}))).sort((a,b) => a.order - b.order || a.member.id.localeCompare(b.member.id));
  const groupedInstanceEntries = new Map();
  for (const entry of instanceEntries) {
    const key = JSON.stringify([entry.category,entry.label]);
    if (!groupedInstanceEntries.has(key)) groupedInstanceEntries.set(key,{...entry,variants:[]});
    groupedInstanceEntries.get(key).variants.push(entry);
  }
  const instanceActions = [...groupedInstanceEntries.values()];
  const instanceActionMap = new Map(instanceActions.flatMap(action => action.variants.map(variant => [variant.id,action])));
  const instanceGroups = categories.filter(category => insideArea(category.path,instanceKey) && category.path.length === instancePath.length + 1).map(group => ({...group,actions:instanceActions.filter(action => memberPaths(action.member).some(path => pathKey(path) === group.area))}));
  const orderedInstanceActions = instanceGroups.flatMap(group => group.actions);
  const instanceGroupFor = action => instanceGroups.find(group => group.actions.includes(action));
  const instanceSection = {id:'instances',path:instancePath};
  const instanceTypes = types.filter(type => typePaths(type).some(path => insideArea(path,instanceKey)));
  const instanceCategoryIds = new Set(categories.filter(category => insideArea(category.path,instanceKey)).map(category => category.id));
  const referenceGroups = categories.filter(category => (category.path[0] === '业务层面' && category.path.length === 2)
    || (category.path[0] === '管理层面' && category.path[1] === '工具' && category.path.length === 3)
    || (category.path[0] === '管理层面' && category.path[1] === '虚拟机' && category.path.length === 3 && !['查询','修改','实例'].includes(category.path[2])));
  // Query and write assignments remain source metadata; a capability has one reading page.
  const managementByPath = new Map();
  const managementSources = new Map([...queryGroups, ...modificationGroups, ...hostReadGroups, ...hostWriteGroups].map(group => [group.id,group]));
  for (const category of categories.filter(category => category.path[0] === '管理层面'
      && ['虚拟机','宿主'].includes(category.path[1]) && ['查询','修改'].includes(category.path[2]) && category.path.length === 4)) {
    const source = managementSources.get(category.id) || category;
    const path = displayPath(source.path), area = pathKey(path);
    if (!managementByPath.has(area)) managementByPath.set(area,{id:source.id,path,area,kind:'management',sources:[],fields:[],methods:[]});
    managementByPath.get(area).sources.push(source);
  }
  const managementGroups = [...managementByPath.values()];
  for (const group of managementGroups) {
    const areas = new Set(group.sources.map(source => source.area));
    const fields = new Map(), methods = new Map();
    const addMethod = (type,member,label) => {
      if (member?.presentation.callable && !methods.has(member.id)) methods.set(member.id,{type,member,label:member.displayName || label});
    };
    for (const source of group.sources) {
      for (const field of source.fields || []) if (field.member.queryField && !fields.has(field.member.id))
        fields.set(field.member.id,{type:field.type,member:field.member,label:field.label});
      for (const entry of [...source.entries || [], ...source.actions || []]) {
        if (entry.member.presentation.callable) addMethod(entry.type,entry.member,entry.label);
        else if (!fields.has(entry.member.id)) fields.set(entry.member.id,entry);
        for (const reference of [entry.reader,entry.related].filter(Boolean)) {
          const target = memberMap.get(reference.id);
          if (target) addMethod(target.type,target.member,hostEntryMap.get(reference.id)?.label);
        }
      }
    }
    // Include the actual service methods as well as the curated operation entries.
    for (const type of types) for (const member of type.members || [])
      if (memberPaths(member).some(path => areas.has(pathKey(path))) && member.presentation.callable
          && type.role === 'entry' && !['ToString','Equals','GetHashCode'].includes(member.name)
          && !['构造函数','构造器','主构造器','运算符'].includes(member.kind))
        addMethod(type,member,member.queryEntry?.label || member.editEntry?.label || member.hostEntry?.label);
    if (group.path[1] === '虚拟机' && fields.size)
      methods.set(queryMethod.id,{type:memberMap.get(queryMethod.id).type,member:queryMethod,label:queryMethod.displayName});
    group.fields = [...fields.values()];
    group.methods = [...methods.values()].sort((a,b) => Number(b.member.id === queryMethod.id) - Number(a.member.id === queryMethod.id) || Number(b.member.isPrimary) - Number(a.member.isPrimary));
  }
  const managementAliases = new Map(managementGroups.flatMap(group => group.sources.map(source => [source.id,group.id])));
  const groupPages = [...managementGroups,
    ...instanceGroups.map(group => ({...group,kind:'instance'})),
    ...referenceGroups.map(group => ({...group,kind:'reference'}))];
  const groupPageMap = new Map(groupPages.map(group => [group.id,group]));
  const pageForMember = new Map();
  for (const group of groupPages) {
    for (const field of group.fields || []) pageForMember.set(field.id || field.member.id,group);
    for (const entry of group.entries || []) pageForMember.set(entry.member.id,group);
    for (const method of group.methods || []) if (!pageForMember.has(method.member.id)) pageForMember.set(method.member.id,group);
    if (group.kind === 'management') for (const field of group.fields) {
      pageForMember.set(field.member.id,group);
      pageForMember.set('modify-' + field.member.id,group);
    }
    for (const action of group.actions || []) {
      if (group.kind === 'instance') for (const variant of action.variants) {
        pageForMember.set(variant.id,group);
        pageForMember.set(variant.member.id,group);
      }
      else pageForMember.set(action.member.id,group);
    }
  }
  const contractHomes = new Map();
  const contractRoots = new Map();
  const basicInformationPage = managementGroups.find(group => group.path[1] === '虚拟机' && group.path.at(-1) === '基本信息')?.id;
  const fieldReferences = new Map();
  const capabilityReferences = new Map();
  const processorCapabilities = {
    ProcessorCount:'Count', ResourceReservation:'Reservation', ResourceLimit:'Limit', SchedulingWeight:'RelativeWeight',
    NestedVirtualization:'ExposeVirtualizationExtensions', HostResourceProtection:'EnableHostResourceProtection',
    MigrationCompatibility:'CompatibilityForMigrationEnabled', MigrationFeatureSet:'CompatibilityForMigrationMode',
    LegacyOperatingSystemCompatibility:'CompatibilityForOlderOperatingSystemsEnabled', SimultaneousMultithreading:'SmtMode',
    SpeculationControlPolicy:'DisableSpeculationControls', ArchitecturalPerformanceMonitoring:'EnablePerfmonArchPmu',
    ActivityCounters:'AllowAcountMcount', ProcessorBrand:'CpuBrandString', InterruptControllerMode:'ApicMode',
    L3CacheAssociativity:'L3CacheWays', L3ProcessorDistribution:'L3DistributionPolicy', LargePageMitigation:'PageShatterMode',
    FrequencyMaximum:'PerfCpuFreqCapMhz', FrequencyMinimum:'PerfCpuFreqMinMhz', DesiredFrequency:'PerfCpuFreqDesiredMhz',
    EnergyPerformancePreference:'PerfCpuEnergyPerformancePreference', AutonomousActivityWindow:'PerfCpuAutonomousActivityWindow',
    IgnoreHostFrequencyMaximum:'PerfCpuIgnoreHostMaxFrequency', PerformanceMonitoring:'EnablePerfmonPmu',
    LastBranchRecording:'EnablePerfmonLbr', PreciseEventSampling:'EnablePerfmonPebs', InstructionTracing:'EnablePerfmonIpt',
    HardwareIsolation:'HardwareIsolationExtensionsEnabled', HardwareIsolatedGuestLimit:'MaxHwIsolatedGuests',
    ProcessorClustersPerSocket:'MaxClusterCountPerSocket', ProcessorsPerL3Domain:'MaxProcessorCountPerL3',
    ProcessorsPerNumaNode:'MaxProcessorsPerNumaNode', NumaNodesPerSocket:'MaxNumaNodesPerSocket',
    PhysicalAddressWidth:'PhysicalAddressWidth', LocalPeripheralInterruptMode:'LpiMode'
  };
  const processorCapabilityType=types.find(type => type.shortName === 'VmProcessorCapability');
  const processorFields=types.find(type => type.shortName === 'VmProcessorFields');
  const processorPage=pageForMember.get(processorFields.members[0].id);
  referenceTargets.set(processorCapabilityType.id,processorPage.id+'--fields');
  for (const capability of processorCapabilityType.members) {
    const field=processorFields.members.find(member => member.name === processorCapabilities[capability.name]);
    if (!field) throw new Error('处理器能力尚未关联字段：'+capability.name);
    referenceTargets.set(capability.id,field.id);
    capabilityReferences.set(field.id,capability);
  }
  const usesOf = member => [
    ...[...new Set((member.usage?.parameters || []).flatMap(parameter => parameter.types))].map(id => ({id,slot:'parameters'})),
    ...(member.usage?.returns || []).map(id => ({id,slot:'returns'})),
    ...(member.usage?.value || []).map(id => ({id,slot:'value'})),
    ...(member.usage?.exceptions || []).map(id => ({id,slot:'exceptions'}))
  ];
  const memberPage = (type,member) => pageForMember.get(member.id)
    || groupPages.find(group => group.kind === 'reference' && memberPaths(member).some(path => insideArea(path,group.area))) || type;
  // The shared query protocol is referenced by every field page. It is not a
  // contract owned by Basic Information merely because that page appears first.
  const roots = [...memberMap.values()].filter(({type,member}) => type.role === 'entry' && member.id !== queryMethod.id
    && memberPage(type,member).id !== basicInformationPage
    && !['构造函数','构造器','主构造器','运算符'].includes(member.kind)
    && !['ToString','Equals','GetHashCode'].includes(member.name) && memberPage(type,member));
  let candidates = roots.map(item => ({...item,root:item.member.id,page:memberPage(item.type,item.member).id}));
  let pending = types.filter(type => type.role === 'contract' && !referenceTargets.has(type.id)
    && !type.members.every(member => member.queryField));
  // Walk outward from real operations. A type is assigned once, so recursive
  // models remain links and never cause recursive or duplicated documentation.
  while (candidates.length && pending.length) {
    const available = candidates.flatMap(candidate => usesOf(candidate.member).map(use => ({...candidate,...use})));
    const assigned = [];
    for (const type of pending) {
      const choices = available.filter(use => use.id === type.id && use.type.id !== type.id);
      const score = use => (use.member.queryEntry ? -40 : use.member.isPrimary ? -30 : 0)
        + (typePaths(type).some(path => memberPaths(use.member).some(other => pathKey(displayPath(other)) === pathKey(displayPath(path)))) ? -20 : 0)
        + ({parameters:3,returns:-6,value:0,exceptions:6}[use.slot]);
      choices.sort((a,b) => score(a)-score(b) || a.member.id.localeCompare(b.member.id));
      if (!choices.length) continue;
      const owner=choices[0];
      contractHomes.set(type.id,{member:owner.member.id,slot:owner.slot,root:owner.root,page:owner.page});
      contractRoots.set(owner.root,owner.page);
      referenceTargets.set(type.id,`${owner.root}--type-${type.id}`);
      for (const member of type.members) referenceTargets.set(member.id,`${owner.root}--${member.id}`);
      assigned.push(type);
    }
    pending=pending.filter(type => !contractHomes.has(type.id));
    candidates=assigned.flatMap(type => type.members.map(member => ({...contractHomes.get(type.id),type,member})));
  }
  // Modification metadata identifies the exact input property for an existing
  // field. Ambiguous relationships are deliberately not merged by name alone.
  const propertyFields = new Map();
  for (const {member:field} of memberMap.values()) if (field.queryField && field.modification) {
    for (const match of field.modification.input.matchAll(/\b(\w+)\.(\w+)\b/g))
      for (const methodId of field.modification.memberIds) {
        const method=memberMap.get(methodId)?.member;
        const parameter=method?.usage?.parameters.find(parameter => parameter.name === match[1]);
        for (const typeId of parameter?.types || []) {
          const property=typeMap.get(typeId)?.members.find(member => member.name === match[2] && !member.presentation.callable);
          if (!property) continue;
          if (!propertyFields.has(property.id)) propertyFields.set(property.id,new Set());
          propertyFields.get(property.id).add(field.id);
        }
      }
  }
  for (const [property,fields] of propertyFields) if (fields.size === 1) {
    const field=[...fields][0];
    fieldReferences.set(property,field);
    referenceTargets.set(property,field);
  }
  for (const {type,member} of memberMap.values())
    if (type.role === 'contract' && !member.presentation.callable && pageForMember.has(member.id) && !member.queryField) {
      fieldReferences.set(member.id,member.id);
      referenceTargets.delete(member.id);
    }
  // Result properties reuse the field documentation without becoming input
  // properties on those fields (in particular, Basic Information's State).
  const resultFieldReferences = new Map();
  const standaloneContractMembers = new Set();
  const affinityResult = types.find(type => type.shortName === 'CpuAffinityService.AffinityState');
  if (affinityResult) for (const member of affinityResult.members) {

        const extra = (entry.reader ? referenceRow('读取',reference(entry.reader)) : '')
          + (entry.related ? referenceRow(entry.area === '查询' ? '修改' : '查询',reference(entry.related)) : '');
        return memberCard(entry.type,entry.member,entry.label,2,extra) + `<span id="${entry.member.id}--usage"></span>`;
      }).join('');
      if (group.id === hostGroupModification?.id)
        content += editableFields.filter(field => field.member.navigationPath[1] === '宿主').map(field => modificationCard(field)).join('');
      content += [...readers.values()].filter(Boolean).map(reader => memberCard(reader.type,reader.member,reader.member.name,2)).join('');
      content += group.entries.filter(entry => entry.reader).map(entry => `<span id="${entry.member.id}--read"></span>`).join('');
      content += hostUsageHtml(group.hostArea,group.path.at(-1));
    } else if (group.kind === 'instance') {
      content = group.actions.map(action => action.variants.map(variant => `<section id="${variant.id}"><span id="${variant.id}--usage"></span>${memberCard(variant.type,variant.member,action.label + (variant.mode ? ' · ' + variant.mode : ''),2)}</section>`).join('')).join('');
    } else {
      const selected = types.filter(type => typePaths(type).some(path => insideArea(path,group.area)));
      const usage = group.path[0] === '业务层面' ? (data.businessUsage || []).find(item => item.category === group.path[1])?.html || '' : '';
      content = categories.filter(category => category.id !== group.id && insideArea(category.path,group.area)).map(category => `<span id="${category.id}"></span>`).join('')
        + usageSection(usage,group.id+'--description') + capabilityContent(selected,group);
    }
    main.innerHTML = `<div id="${group.id}">${content || '<p class="empty">本分类暂无公开成员。</p>'}</div>`;
    document.getElementById('breadcrumb-current').textContent = pathKey(group.path[0] === '管理层面' ? group.path.slice(1) : group.path);
  }
  function renderDesign(design) {
    currentType = null;
    main.className = 'article design-article';
    const draft = design.status === 'draft';
    main.innerHTML = `<header id="${escape(design.id)}"><div class="design-heading"><h1>${escape(design.title)}</h1><span class="design-state ${draft ? 'draft' : ''}">${draft ? '规划草案' : '当前结构'}</span></div><p class="lead">${escape(design.summary)}</p></header>${design.sections.map(section => `<section><h2 id="${escape(section.id)}">${escape(section.title)}</h2>${section.html}</section>`).join('')}`;
    document.getElementById('breadcrumb-current').textContent = '设计图 / ' + design.title;

  }
  function closeNavigation(focusTarget) {
    const wasOpen = document.body.classList.contains('nav-open');
    document.body.classList.remove('nav-open'); menu.setAttribute('aria-expanded','false');
    if (wasOpen) (focusTarget instanceof HTMLElement ? focusTarget : menu).focus({preventScroll:true});
  }
  function route() {
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { id = ''; }
    if (id === 'main-content') { main.focus(); return; }
    if (!id) id = 'overview';
    if (id === 'design') id = designs[0]?.id || id;
    const previousIndexes = {'query-reference':'overview','modification-reference':'overview',
      'query-fields':'overview','modification-fields':'overview','host-query':'overview','host-modification':'overview',
      'guide-接入与基本约定':'guide-开始使用','guide-自由组合查询':'guide-查询数据',
      'guide-实例操作':'guide-创建导入与导出','guide-控制台连接方式':'guide-连接与交互',
      'guide-管理接口迁移':'guide-升级已有调用','guide-调用示例':'guide-开始使用',
      'guide-宿主条件与已知限制':'guide','guide-文档维护':'guide',
      'modification-coverage':'overview','instances-reference':'instances','instances--reference':'instances','host-groups':'overview','api-9d0d5255282aee00':'api-50a59fb2ce904b81','api-78fbcada8bd8cd8c':'api-4cf0073950220bf3'};
    id = previousIndexes[id] || previousIndexes[id.split('--')[0]] || id;
    if (id === 'guide' || id.startsWith('guide-')) {
      const destinations = {
        'guide-查询数据':queryMethod.id,
        'guide-创建导入与导出':'category-vm',
        'guide-部署流程':managementGroups.find(group => group.path[1] === '虚拟机' && group.path.at(-1) === 'GPU')?.id,
        'guide-连接与交互':referenceGroups.find(group => group.path[1] === '连接')?.id,
        'guide-结果取消和资源释放':types.find(type => type.shortName === 'ApiResponse')?.id
      };
      id = destinations[id] || 'overview';
    }
    id = data.categoryAliases?.[id] || id;
    id = managementAliases.get(id) || id;
    id = referenceTarget(id);
    const oldCategory = categoryMap.get(id);
    if (oldCategory && oldCategory.path.length === 3 && oldCategory.path[0] === '管理层面'
        && ['虚拟机','宿主'].includes(oldCategory.path[1]) && ['查询','修改'].includes(oldCategory.path[2])) id = 'overview';
    id = categoryMap.get(id)?.guideId || id;
    const hostRoute = id.includes('--') ? id.split('--')[0] : id;
    const selectedHostEntry = hostEntryMap.get(id) || hostEntryMap.get(hostRoute);
    const hostPage = id === 'host-query' || id === 'host-modification' ? id : hostCategoryPages.get(id);
    let selectedType = typeMap.get(id) || memberMap.get(id)?.type;
    const standaloneMember = standaloneContractMembers.has(id) ? memberMap.get(id).member : null;
    const selectedField = queryFieldMap.get(id) || (id.includes('--') ? queryFieldMap.get(id.split('--')[0]) : null);
    const selectedGroupPage = resolveGroupPage(id);
    const selectedModification = modificationFieldMap.get(id) || (id.includes('--') ? modificationFieldMap.get(id.split('--')[0]) : null);
    const modificationPage = id === 'modification-fields' || modificationCategoryIds.has(id) ? 'modification-fields' : null;
    const queryPage = id === 'query-fields' || queryCategoryIds.has(id) ? 'query-fields' : null;
    if (!selectedType && id.includes('--')) selectedType = typeMap.get(id.split('--')[0])
      || typeMap.get(contractRoots.get(id.split('--')[0]));
    const selectedHub = categoryHubMap.get(id);
    const selectedDesign = designMap.get(id) || (id.includes('--') ? designMap.get(id.split('--')[0]) : null);
    const selectedInstance = instanceActionMap.get(id) || (id.includes('--') ? instanceActionMap.get(id.split('--')[0]) : null);
    const instancePage = id === 'instances' || id.startsWith('instances--') || instanceCategoryIds.has(id);
    const page = selectedHub?.id || standaloneMember?.id || selectedGroupPage?.id || (selectedHostEntry ? selectedHostEntry.member.id : hostPage || (selectedInstance ? selectedInstance.id : instancePage ? 'instances' : selectedModification?.id || modificationPage || selectedField?.member.id || queryPage || selectedType?.id || selectedDesign?.id || (id.startsWith('overview') || categoryMap.has(id) ? 'overview' : 'missing')));
    if (page !== currentRoute) {
      if (selectedHub) renderCategoryHub(selectedHub);
      else if (standaloneMember) renderType(selectedType,standaloneMember);
      else if (selectedGroupPage) renderGroupPage(selectedGroupPage);
      else if (selectedHostEntry) renderHostEntry(selectedHostEntry);
      else if (hostPage) renderHostCatalog(hostPage === 'host-query' ? '查询' : '修改');
      else if (selectedInstance) renderInstanceEntry(selectedInstance);
      else if (instancePage) renderInstances();
      else if (selectedModification) renderModificationField(selectedModification);
      else if (modificationPage === 'modification-fields') renderModificationCatalog();
      else if (selectedField) renderQueryField(selectedField);
      else if (queryPage === 'query-fields') renderQueryCatalog();
      else if (selectedType) renderType(selectedType);
      else if (selectedDesign) renderDesign(selectedDesign);
      else if (page === 'overview') renderOverview();
      else {
        currentType = null; main.className = 'article';
        main.innerHTML = `<h1>未找到文档</h1><p>此链接指向的类型或成员不在当前版本中。</p><p>${link('overview','返回概览')}</p>`;
        document.getElementById('breadcrumb-current').textContent = '未找到文档';
      }
      main.innerHTML = referenceLinks(main.innerHTML);
      currentRoute = page;
      window.scrollTo(0,0);
    }
    revealNavigationGroup(id);
    renderNavigation();
    document.getElementById('reference-tab').setAttribute('aria-current', selectedDesign ? 'false' : 'page');
    document.getElementById('design-tab').setAttribute('aria-current', selectedDesign ? 'page' : 'false');
    closeNavigation(main);
    requestAnimationFrame(() => {
      const target = document.getElementById(id);
      if (id === page) window.scrollTo(0,0);
      else if (target) target.scrollIntoView({block:'start'});
    });
  }
  search.addEventListener('input', renderNavigation);
  clearSearch.addEventListener('click', () => { search.value=''; renderNavigation(); search.focus(); });
  search.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      const first = navigation.querySelector('a');
      if (first) { event.preventDefault(); const target = first.getAttribute('href'); if (location.hash === target) route(); else location.hash = target; closeNavigation(main); }
    }
    if (event.key === 'Escape') { search.value=''; renderNavigation(); }
  });
  menu.addEventListener('click', () => { const opened = document.body.classList.toggle('nav-open'); menu.setAttribute('aria-expanded',String(opened)); if (opened) search.focus(); });
  document.getElementById('nav-scrim').addEventListener('click',closeNavigation);
  // Repeated fragment clicks do not emit hashchange; use the same positioning as the first visit.
  document.addEventListener('click',event => {
    if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const anchor = event.target.closest?.('a[href^="#"]');
    if (!anchor || anchor.hasAttribute('download') || (anchor.target && anchor.target !== '_self')) return;
    if (anchor.getAttribute('href') !== location.hash) return;
    event.preventDefault();
    route();
  });
  document.addEventListener('keydown',event => { if (event.key === 'Escape') closeNavigation(); });
  window.addEventListener('hashchange',route);
  renderNavigation();
  route();
})();
</script>
</body>
</html>
